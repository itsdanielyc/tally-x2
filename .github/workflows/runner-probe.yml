name: runner-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-15-arm64, macos-14]
    steps:
      - name: Report architecture
        run: uname -sm
